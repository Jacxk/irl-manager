logLevel: info
authMethod: http
# Overridden by MTX_AUTHHTTPADDRESS in Compose.
authHTTPAddress: http://web:3000/api/media/auth
authHTTPExclude: []
api: false
rtsp: true
rtspTransports: [tcp]
rtmp: true
srt: true
hls: true
hlsAlwaysRemux: false
hlsVariant: fmp4
hlsSegmentCount: 7
hlsSegmentDuration: 1s
webrtc: false
paths:
  all_others:
    source: publisher
    overridePublisher: false
