services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: irl
      POSTGRES_USER: irl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U irl']
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build:
      context: .
      args:
        MOBLIN_GATEWAY_URL: ${MOBLIN_GATEWAY_URL:-http://moblin:3001}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://irl:${POSTGRES_PASSWORD}@db:5432/irl
      MEDIA_HLS_URL: http://media:8888
    ports: ['3000:3000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      db: { condition: service_healthy }
  installer:
    build:
      context: .
      dockerfile: infra/installer.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://irl:${POSTGRES_PASSWORD}@db:5432/irl
      INSTALLER_DATA_DIR: /var/lib/irl-installer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - installer:/var/lib/irl-installer
    depends_on:
      db: { condition: service_healthy }
      web: { condition: service_healthy }
  moblin:
    build:
      context: .
      dockerfile: infra/moblin.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://irl:${POSTGRES_PASSWORD}@db:5432/irl
    ports: ['${MOBLIN_HOST_BIND:-127.0.0.1}:3001:3001']
    depends_on:
      db: { condition: service_healthy }
      web: { condition: service_healthy }
  media:
    image: bluenviron/mediamtx:1.15.6
    profiles: [streaming]
    environment:
      MTX_AUTHHTTPADDRESS: http://web:3000/api/media/auth
    volumes: ['./infra/mediamtx.yml:/mediamtx.yml:ro']
    ports: ['1935:1935', '8890:8890/udp']
    depends_on: [web]
  srtla:
    build:
      context: .
      dockerfile: infra/srtla.Dockerfile
    profiles: [streaming]
    ports: ['5000:5000/udp']
    depends_on: [media]
  worker:
    build:
      context: .
      dockerfile: infra/worker.Dockerfile
    profiles: [streaming]
    env_file: .env
    environment:
      DATABASE_URL: postgres://irl:${POSTGRES_PASSWORD}@db:5432/irl
      MEDIA_INTERNAL_HOST: media
    depends_on: [media]
volumes:
  postgres:
  installer:
